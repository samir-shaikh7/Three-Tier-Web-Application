apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier
  labels:
    role: frontend
    env: demo
spec: 
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  selector:
    matchLabels: 
      role: frontend
  template:
    metadata:
      labels:
        role: frontend
    spec: 
      # imagePullSecrets:
      # - name: ecr-registry-secret
      containers:
      - name: frontend
        # image: 407622020962.dkr.ecr.us-east-1.amazonaws.com/frontend:latest
        # imagePullPolicy: Always
        image: samirshaikh7/frontend:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: REACT_APP_BACKEND_URL
            value: "http://13.232.89.26:30002/api/tasks"  # paste public ip of any node of k8s cluster      
        ports:
        - containerPort: 3000
